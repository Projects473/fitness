:root{--bg:#07080a;--panel:rgba(255,255,255,.045);--panel-2:rgba(255,255,255,.08);--border:rgba(255,255,255,.09);--border-2:rgba(255,255,255,.16);--text:#f4f4f5;--muted:#9a9aa6;--faint:#5e5e68;--green:#22c55e;--green-2:#4ade80;--amber:#f59e0b;--red:#f43f5e;--blue:#60a5fa;--cyan:#22d3ee;--input:rgba(255,255,255,.05);--fig:#e9e9ee;--plate:#8b8b96;--glow:0 0 0 1px var(--border),0 20px 50px -20px rgba(0,0,0,.6);--r:22px;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--disp:Sora,Inter,sans-serif;--bgfx:radial-gradient(1100px 600px at 0% -10%,rgba(34,197,94,.2),transparent 60%),radial-gradient(900px 520px at 110% 0%,rgba(96,165,250,.14),transparent 60%)}
[data-theme=light]{--bg:#f3f4f7;--panel:rgba(255,255,255,.82);--panel-2:#fff;--border:rgba(15,15,20,.08);--border-2:rgba(15,15,20,.16);--text:#0b0b0c;--muted:#62626c;--faint:#a1a1aa;--input:rgba(15,15,20,.04);--fig:#26262b;--plate:#8b8b96;--glow:0 0 0 1px var(--border),0 18px 40px -24px rgba(20,20,40,.25);--bgfx:radial-gradient(1100px 600px at 0% -10%,rgba(34,197,94,.16),transparent 60%),radial-gradient(900px 520px at 110% 0%,rgba(96,165,250,.14),transparent 60%)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:14px/1.5 var(--sans);background:var(--bgfx),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1180px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 6px 18px rgba(34,197,94,.35))}
.brand b{font-family:var(--disp);font-size:18px;letter-spacing:-.01em;display:block}
.brand small{color:var(--muted);font-size:12px}
.tools{display:flex;align-items:center;gap:10px}
.saved{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.daysw{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:4px;backdrop-filter:blur(14px)}
.daysw button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.daysw button:hover{background:var(--panel-2);color:var(--text)}
.daysw select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font-weight:600;padding:0 6px;text-align:center;font-family:var(--disp);cursor:pointer;outline:none}
.daysw select option{color:#111}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--border);color:var(--text)}
.iconbtn svg,.nav svg,.tabbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:5px;margin-bottom:20px;backdrop-filter:blur(14px)}
.nav button{padding:9px 18px;border-radius:999px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;transition:color .25s}
.nav button.on{color:#06210f;background:linear-gradient(135deg,var(--green-2),var(--green));box-shadow:0 8px 24px -6px rgba(34,197,94,.6)}
.tabbar{display:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.45fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--glow);backdrop-filter:blur(14px)}
.card h2{font-family:var(--disp);font-size:16px;margin:0;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.badge.g{color:var(--green-2)}.badge.g i{background:var(--green)}
.badge.a{color:var(--amber)}.badge.a i{background:var(--amber)}
.ringrow{display:flex;gap:28px;align-items:center}
.ring{position:relative;width:180px;height:180px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--panel-2)}
.ring .val{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ctr b{font-family:var(--disp);font-size:38px;letter-spacing:-.03em;display:block;line-height:1}
.ring .ctr small{color:var(--muted);font-size:12px}
.ring.sm{width:120px;height:120px}.ring.sm .ctr b{font-size:26px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;flex:1}
.kpi small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.kpi b{font-family:var(--disp);font-size:22px;letter-spacing:-.02em;display:block}
.kpi span{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.row b{color:var(--text);font-size:13px;letter-spacing:0;text-transform:none}
.bar{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .6s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.tile{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tile b{font-family:var(--disp);font-size:20px;display:block}
.tile span{color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font-weight:600;background:var(--panel-2);border:1px solid var(--border);transition:.2s}
.btn:hover{border-color:var(--border-2);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--green-2),var(--green));color:#06210f;border:0;box-shadow:0 10px 26px -10px rgba(34,197,94,.8)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.on{background:linear-gradient(135deg,var(--green-2),var(--green));color:#06210f;border-color:transparent}
.btn.block{width:100%}
.btn.danger{color:var(--red)}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.dchip{position:relative;text-align:left;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:8px 9px 10px;min-height:66px;transition:.2s}
.dchip:hover{border-color:var(--border-2)}
.dchip b{font-family:var(--disp);font-size:13px;display:block}
.dchip span{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dchip.done .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.dchip.sel{border-color:var(--green);background:rgba(34,197,94,.1)}
.dchip .mini{height:4px;border-radius:9px;background:var(--panel);margin-top:6px;overflow:hidden}
.dchip .mini i{display:block;height:100%;background:var(--green)}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;margin:10px 0;border:1px solid var(--border)}
.banner.ok{background:rgba(34,197,94,.1);color:#bbf7d0}
.banner.warn{background:rgba(245,158,11,.1);color:#fde68a}
.banner.info{background:rgba(96,165,250,.1);color:#bfdbfe}
[data-theme=light] .banner.ok{color:#166534}[data-theme=light] .banner.warn{color:#92400e}[data-theme=light] .banner.info{color:#1e40af}
.exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.exc{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--glow);display:flex;flex-direction:column;gap:10px}
.exc.done{border-color:rgba(34,197,94,.5)}
.exc .art{background:var(--panel-2);border-radius:16px;padding:6px}
.exc .art svg{width:100%;height:auto;display:block}
.exc .art:has(.ph){padding:0;background:none}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ph figure{margin:0;position:relative}
.ph img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:14px;display:block;background:var(--panel-2)}
.ph figcaption{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;backdrop-filter:blur(6px)}
.art .draw{display:none}.art .draw.on,.art.bad .draw{display:block}.art.bad .ph{display:none}.art.bad{padding:6px;background:var(--panel-2)}
.exc h3{font-family:var(--disp);font-size:15px;margin:0}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.pill.g{color:var(--green-2);background:rgba(34,197,94,.12)}
.cue{color:var(--muted);font-size:13px;margin:0}
.log{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
input[type=text],input[type=date],select.f,textarea{background:var(--input);border:1px solid var(--border);border-radius:12px;padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--green)}
textarea{min-height:70px;resize:vertical}
.ck{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer;user-select:none}
.ck input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:8px;border:1.5px solid var(--border-2);background:var(--input);display:grid;place-items:center;margin:0;cursor:pointer;flex:0 0 auto}
.ck input:checked{background:linear-gradient(135deg,var(--green-2),var(--green));border-color:transparent}
.ck input:checked::after{content:"";width:6px;height:11px;border:solid #06210f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.list .ck{display:flex;padding:11px 0;border-bottom:1px solid var(--border);font-weight:500;font-size:14px}
.list .ck:last-child{border-bottom:0}
.list .ck.on span{color:var(--muted);text-decoration:line-through}
.list .ck em{margin-left:auto;font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tot td{font-weight:700;border-top:1px solid var(--border-2)}
.seg{display:inline-flex;gap:2px;background:var(--panel-2);border-radius:999px;padding:4px}
.seg button{padding:6px 12px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}

h1.sec{font-family:var(--disp);font-size:22px;letter-spacing:-.02em;margin:26px 0 12px}
.muted{color:var(--muted)}.small{font-size:12.5px}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:4px 0}
.fab{position:fixed;right:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--green-2),var(--green));color:#06210f;display:grid;place-items:center;box-shadow:0 18px 40px -12px rgba(34,197,94,.9);z-index:40;transition:transform .2s}
.fab:hover{transform:translateY(-3px) rotate(90deg)}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet .card{width:min(560px,100%);border-radius:24px 24px 0 0;max-height:85vh;overflow:auto;background:var(--bg);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:24px}}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa button{text-align:left;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.qa button:hover{border-color:var(--green)}
.qa button b{display:block;font-family:var(--disp);color:var(--green-2)}
.qa button span{font-size:12.5px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
@media(max-width:980px){.g2,.g2e{grid-template-columns:1fr}.days{grid-template-columns:repeat(6,1fr)}}
@media(max-width:700px){
.nav{display:none}
.tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:45;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:6px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);justify-content:space-between;box-shadow:var(--glow)}
[data-theme=dark] .tabbar{background:rgba(20,22,24,.85)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:7px 0;border-radius:16px}
.tabbar button svg{width:20px;height:20px}
.tabbar button.on{color:#06210f;background:linear-gradient(135deg,var(--green-2),var(--green))}
.fab{bottom:calc(92px + env(safe-area-inset-bottom));right:16px;width:54px;height:54px;border-radius:18px}
.ringrow{flex-direction:column;align-items:stretch}.ring{margin:0 auto}
.days{grid-template-columns:repeat(5,1fr)}
.saved{display:none}
.exs{grid-template-columns:1fr}
.card{padding:16px}
.dchip span{display:none}
}
</style>
</head>

'<div class="tools"><span class="saved" id="saved"><i></i><span>'+(mode==="page"?"Saved to this page":"Saved on this device")+'</span></span><div class="daysw"><button data-step="-1" aria-label="Previous day"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><select id="daysel" aria-label="Day">'+opts+'</select><button data-step="1" aria-label="Next day"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>'+
'<button class="iconbtn" id="theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24">'+(theme==="dark"?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>')+'</svg></button></div></div>'+
'<div class="nav">'+TABS.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'"><svg viewBox="0 0 24 24">'+t[2]+'</svg>'+t[1]+'</button>'}).join("")+'</div>'}
function tabbar(){return '<div class="tabbar">'+TABS.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'"><svg viewBox="0 0 24 24">'+t[2]+'</svg>'+t[1]+'</button>'}).join("")+'</div><button class="fab" id="fab" aria-label="Log protein"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>'}

function dayChips(){var o='<div class="days">';for(var d=1;d<=30;d++){var dn=(S.habits[d]||[])[0];o+='<button class="dchip'+(dn?" done":"")+(d===sel?" sel":"")+'" data-go="'+d+'"><i class="dot"></i><b>Day '+d+'</b><span>'+W[wd(d)].t.split(" ")[0]+'</span><div class="mini"><i style="width:'+Math.round(hc(d)/6*100)+'%"></i></div></button>'}return o+'</div>'}
function protChart(){var w=560,h=170,pad=28,end=Math.max(7,sel),days=[];for(var d=end-6;d<=end;d++)days.push(d);
var max=180,bw=(w-pad*2)/7,o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Protein for the last 7 days"><rect x="'+pad+'" y="'+(h-24-(PT/max)*(h-44))+'" width="'+(w-pad*2)+'" height="2" fill="rgba(34,197,94,.6)"/><text x="'+(w-pad)+'" y="'+(h-30-(PT/max)*(h-44))+'" text-anchor="end" fill="var(--muted)" font-size="10" font-family="Inter">'+PT+' g goal</text>';
days.forEach(function(d,i){var v=prot(d),bh=(Math.min(v,max)/max)*(h-44),x=pad+i*bw+bw*.2;o+='<rect x="'+x+'" y="'+(h-24-bh)+'" width="'+(bw*.6)+'" height="'+Math.max(bh,2)+'" rx="6" fill="'+(v>=PT?"#22c55e":v>0?"#60a5fa":"var(--panel-2)")+'"/><text x="'+(x+bw*.3)+'" y="'+(h-8)+'" text-anchor="middle" fill="'+(d===sel?"var(--text)":"var(--muted)")+'" font-size="11" font-family="Inter" font-weight="600">D'+d+'</text>'+(v?'<text x="'+(x+bw*.3)+'" y="'+(h-28-bh)+'" text-anchor="middle" fill="var(--text)" font-size="11" font-family="Inter">'+v+'</text>':"")});
return o+'<line x1="'+pad+'" y1="'+(h-24)+'" x2="'+(w-pad)+'" y2="'+(h-24)+'" stroke="var(--border-2)"/></svg>'}

function home(){var dn=0,str=0,strDone=0,tot=0;for(var d=1;d<=30;d++){var h=S.habits[d]||[];if(h[0])dn++;tot+=hc(d);if(W[wd(d)].k==="Strength"){str++;if(h[0])strDone++}}
var w0=parseFloat((S.meas.d1||{}).waist),wl=parseFloat((S.meas.d30||{}).waist)||parseFloat((S.meas.d15||{}).waist),wch=isNaN(w0)||isNaN(wl)?"—":((wl-w0)>0?"+":"")+(wl-w0).toFixed(1)+" in";

return '<div class="grid g2"><div class="card"><div class="hd"><div><h2>Road to Day 30</h2><p class="sub">Leaner waist, bigger chest, shoulders & arms</p></div><span class="badge'+(dn?" g":"")+'"><i></i>'+(dn?"In progress":"Not started")+'</span></div><div class="ringrow">'+ring(dn/30,Math.round(dn/30*100)+"%","of 30 days")+

'<div class="card"><div class="hd"><div><h2>Day '+sel+' · '+DAYN[wd(sel)]+(S.start?' <span class="muted small">'+dateOf(sel)+'</span>':"")+'</h2><p class="sub">'+w.t+' · '+ph.t+'</p></div><span class="badge'+(w.k==="Strength"?" g":"")+'"><i></i>'+w.k+'</span></div>'+
'<div class="row"><span>Exercises done</span><b>'+exDone(sel)+' / '+w.ex.length+'</b></div>'+bar(exDone(sel)/w.ex.length)+
'<div class="row"><span>Protein</span><b>'+p+' / '+PT+' g</b></div>'+bar(p/PT)+
'<div class="tiles"><div class="tile"><small>Habits</small><b>'+hc(sel)+' / 6</b><span>Tick them on Workout</span></div><div class="tile"><small>Protein left</small><b>'+Math.max(0,PT-p)+' g</b><span>≈ '+Math.ceil(Math.max(0,PT-p)/23*10)/10+' × 1½ cups beans</span></div></div>'+
'<button class="btn pri block" data-tab="workout">Open Day '+sel+' workout</button></div></div>'+
'<div class="card" style="margin-top:16px"><div class="hd"><div><h2>Your 30 days</h2><p class="sub">Tap a day · the dot means the workout is done, the bar shows habits</p></div></div>'+dayChips()+'</div>'+
'<div class="grid g2e" style="margin-top:16px"><div class="card chart"><div class="hd"><div><h2>Protein, last 7 days</h2><p class="sub">Tap + to log what you eat</p></div><button class="btn sm" id="fab2">+ Log protein</button></div>'+protChart()+'</div>'+
'<div class="card"><div class="hd"><div><h2>This phase</h2><p class="sub">'+ph.d+'</p></div><span class="badge g"><i></i>'+ph.t+'</span></div><p style="margin:0 0 12px">'+ph.x+'</p>'+PH.map(function(q,i){return '<div class="row" style="margin:8px 0 4px"><span>'+q.d+'</span><b>'+q.t+'</b></div>'+bar(i<phase(sel)?1:i===phase(sel)?((sel-[0,7,14,21][i])/(i===3?9:7)):0)}).join("")+'</div></div>';}

var o='<div class="card"><div class="hd"><div><h2>Day '+d+' · '+DAYN[wd(d)]+' — '+w.t+'</h2><p class="sub">'+(w.k==="Strength"?"About 30 min · rest 60–90 s between sets · leave 1–3 reps in reserve":w.k==="Cardio"?"About 30–40 min":"Recovery day")+'</p></div><span class="badge g"><i></i>'+ph.t+'</span></div><div class="banner ok"><b>'+ph.d+':</b> '+ph.x+'</div>'+(w.k==="Strength"?'<div class="banner info"><b>Warm-up (5 min):</b> arm circles, 10 light push-ups or bodyweight squats, then one easy set of the first exercise at about half weight.</div>':"")+'</div>';
o+='<div class="exs" style="margin-top:16px">'+w.ex.map(function(e,i){var l=lg[i]||{},cardio=w.k!=="Strength";return '<div class="exc'+(l.x?" done":"")+'">'+media(e.p,e.hl)+'<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>'+(i+1)+'. '+esc(e.n)+'</h3>'+(w.k==="Recovery"?"":'<label class="ck"><input type="checkbox" data-ex="'+i+'"'+(l.x?" checked":"")+'>Done</label>')+'</div><div class="pills"><span class="pill g">'+esc(e.s)+'</span>'+(e.w!=="—"?'<span class="pill">Start: '+esc(e.w)+'</span>':"")+'</div><p class="cue">'+esc(e.c)+'</p>'+
(w.k==="Recovery"?"":'<div class="log"><input type="text" data-log="'+i+'" data-f="w" placeholder="'+(cardio?"Time":"Weight used")+'" value="'+esc(l.w)+'"><input type="text" data-log="'+i+'" data-f="r" placeholder="'+(cardio?"How it felt":"Reps e.g. 12,11,10")+'" value="'+esc(l.r)+'"></div>')+'</div>'}).join("")+'</div>';
o+='<div class="grid g2e" style="margin-top:16px"><div class="card"><div class="hd"><div><h2>Daily habits</h2><p class="sub">Day '+d+'</p></div><span class="badge g"><i></i>'+hc(d)+' / 6</span></div><div class="list">'+HAB.map(function(t,i){return '<label class="ck'+(h[i]?" on":"")+'"><input type="checkbox" data-hab="'+i+'"'+(h[i]?" checked":"")+'><span>'+t+'</span>'+(i===1?'<em>'+prot(d)+' g logged</em>':"")+'</label>'}).join("")+'</div></div>'+

o+='<h1 class="sec">Weekly schedule</h1><div class="card"><table><tr><th>Day</th><th>Session</th><th>Type</th></tr>'+W.map(function(x,i){return '<tr><td><b>'+DAYN[i]+'</b></td><td>'+x.t+'</td><td><span class="pill'+(x.k==="Strength"?" g":"")+'">'+x.k+'</span></td></tr>'}).join("")+'</table><p class="small muted" style="margin:8px 0 0">Day 1 is a Monday. Days 29–30 repeat Monday and Tuesday.</p></div>';
o+='<div class="grid g2e" style="margin-top:16px"><div class="card"><h2>When you hit the 30-lb / 70-lb ceiling</h2><ul class="clean small" style="margin-top:10px"><li><b>More reps</b>: up to 15–20 per set.</li><li><b>Slower lowering</b>: 3–4 seconds.</li><li><b>Pauses</b>: 1–2 s at the hardest point.</li><li><b>One side at a time</b>: single-arm press, split squats.</li><li><b>Extra set</b> from Day 15.</li></ul></div><div class="card"><h2>Safety</h2><ul class="clean small" style="margin-top:10px"><li>Never bench without the catches set just below chest height, especially alone.</li><li>70 lb is the bar’s limit, not a target.</li><li>Stop for sharp pain, dizziness or unusual breathlessness.</li><li>Can’t reach the minimum reps with good form? Drop the weight.</li></ul></div></div><p class="small muted" style="margin:14px 2px 0">Exercise photos: <a href="https://github.com/yuhonas/free-exercise-db" style="color:inherit">Free Exercise DB</a> (public domain). They’re shot in a gym, so use your flat bench where they show an incline or a rack.</p>';
return o}

function food(){var p=prot(sel),ts=TEMPLATE.reduce(function(a,b){return a+b[2]},0),tk=TEMPLATE.reduce(function(a,b){return a+b[3]},0);
var o='<div class="grid g2"><div class="card"><div class="hd"><div><h2>Daily targets</h2><p class="sub">Male · 35 · 5′7″ · 165 lb · EC$350 a month for food</p></div><span class="badge g"><i></i>Fat loss</span></div><div class="ringrow">'+ring(p/PT,p+"g","of "+PT+" g today")+'<div class="kpis"><div class="kpi"><small>Calories</small><b>~1,900–2,000</b><span>kcal / day</span></div><div class="kpi"><small>Protein goal</small><b>'+PT+' g</b><span>'+(PT===90?"what EC$350 buys":PT===110?"with the stretch tips":"needs ~EC$600/month")+'</span></div><div class="kpi"><small>Fat</small><b>~55 g</b><span>oil, peanut butter, chicken</span></div><div class="kpi"><small>Carbs</small><b>~260 g</b><span>beans, oats, rice, bread</span></div></div></div>'+
'<div class="row" style="margin-top:18px"><span>Daily protein goal</span><div class="seg">'+[90,110,140].map(function(g){return '<button data-goal="'+g+'" class="'+(PT===g?"on":"")+'">'+g+' g</button>'}).join("")+'</div></div></div>'+
'<div class="card"><h2>Log today’s protein</h2><p class="sub">Day '+sel+' · tap what you ate</p><div class="qa" style="margin-top:12px">'+PQ.slice(0,6).map(function(q,i){return '<button data-qa="'+i+'"><b>+'+q[1]+' g</b><span>'+q[0]+'</span></button>'}).join("")+'</div><button class="btn sm" id="fab3" style="margin-top:10px">More & undo</button></div></div>';
o+='<h1 class="sec">A typical day on EC$350</h1><div class="card"><table><tr><th>Meal</th><th>What</th><th class="r">Protein</th><th class="r">kcal</th></tr>'+TEMPLATE.map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="r">'+r[2]+' g</td><td class="r">~'+r[3]+'</td></tr>'}).join("")+'<tr class="tot"><td>Total</td><td></td><td class="r">~'+ts+' g</td><td class="r">~'+tk.toLocaleString()+'</td></tr></table>'+
'<div class="banner warn" style="margin-bottom:0"><b>Straight answer:</b> EC$350 a month gets you to about 90 g of protein a day, not 130–140 g. At the price estimates used here, 130–140 g costs around EC$600 a month. 90 g (about 1.2 g per kg) is still enough to protect muscle while you lose fat. Gains in size will just be slower. Beans and lentils carry the plan because they’re the cheapest protein per dollar.</div></div>';
o+='<div class="grid g2e" style="margin-top:16px"><div class="card"><h2>How the targets were worked out</h2><table style="margin-top:8px"><tr><td>Resting burn (Mifflin-St Jeor: 74.8 kg, 170 cm, 35 y, male)</td><td class="r">≈ 1,640</td></tr><tr><td>× 1.45 (desk job + 30 min training most days)</td><td class="r">≈ 2,380</td></tr><tr><td>− ~400–500 kcal deficit</td><td class="r"><b>≈ 1,900–2,000</b></td></tr></table><p class="small muted">Expect about 0.5–1 lb a week. After Day 14: waist not moving → ½ cup less rice at dinner; losing over 1.5 lb a week or always drained → add a slice of bread with peanut butter.</p></div>'+
'<div class="card"><h2>Always excluded</h2><div class="pills" style="margin:10px 0 14px">'+["Eggs","Bananas","Eggplant","Yoghurt","Callaloo","Pumpkin"].map(function(x){return '<span class="pill">'+x+'</span>'}).join("")+'</div><h2>Drinks</h2><ul class="clean small" style="margin-top:8px"><li>Water 2–3 L; lime water; unsweetened ginger tea; low-sugar sorrel. All nearly free.</li><li>Skip soft drinks, sweet juices and energy drinks. They cost money and calories.</li></ul></div></div>';
o+='<h1 class="sec">Meal plan</h1><div class="card"><div class="hd"><div><h2>Week '+(mweek+1)+'</h2><p class="sub">Snack every day: 1 slice bread + fruit. Days 29–30 repeat Week 1 Mon–Tue.</p></div><div class="seg">'+[0,1,2,3].map(function(i){return '<button data-mw="'+i+'" class="'+(mweek===i?"on":"")+'">W'+(i+1)+'</button>'}).join("")+'</div></div><table><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr>'+MEALS[mweek].map(function(m,i){return '<tr><td><b>'+DAYN[i].slice(0,3)+'</b></td><td>'+m[0]+'</td><td>'+m[1]+'</td><td>'+m[2]+'</td></tr>'}).join("")+'</table></div>';
o+='<div class="grid g2e" style="margin-top:16px"><div class="card"><h2>Making 2.5 lb of chicken last a week</h2><ul class="clean small" style="margin-top:8px"><li>Cut it into 7 small portions (about 85 g cooked each) before freezing.</li><li>Thighs, drumsticks or whole chicken are cheaper per lb than breast.</li><li>Use a whole chicken’s carcass for a lentil soup.</li></ul></div>'+
'<div class="card"><h2>Batch-cook</h2><ul class="clean small" style="margin-top:8px"><li>Sunday and Wednesday: soak and cook 500 g beans or lentils, a pot of rice, and the chicken.</li><li>Season with garlic, onion, thyme, black pepper and lime; go light on oil.</li><li>Cook chicken to 165°F / 74°C; freeze anything you won’t eat within 3–4 days.</li></ul></div></div>';return o}

function shopV(){var isM=gweek==="m",l=shop(gweek),key=isM?"m":gweek,sh=S.shop[key]||{},tot=0,pr=0,got=0;l.forEach(function(x,i){tot+=x[2];pr+=x[3];if(sh[i])got++});
var segs='<div class="seg"><button data-gw="m" class="'+(isM?"on":"")+'">Month</button>'+[0,1,2,3].map(function(i){return '<button data-gw="'+i+'" class="'+(gweek===i?"on":"")+'">W'+(i+1)+'</button>'}).join("")+'</div>';
var rows="",sec="";l.forEach(function(x,i){if(isM&&x[4]!==sec){sec=x[4];rows+='<div class="row" style="margin:16px 0 2px"><span>'+sec+'</span></div>'}rows+='<label class="ck'+(sh[i]?" on":"")+'"><input type="checkbox" data-shop="'+i+'"'+(sh[i]?" checked":"")+'><span>'+x[0]+(x[1]?' <span class="muted">· '+x[1]+'</span>':"")+'</span><em>EC$'+x[2]+(x[3]>=30?' · '+x[3]+' g protein':"")+'</em></label>'});

'<table style="margin-top:14px"><tr><th>Shop</th><th class="r">Est.</th></tr>'+weeks.map(function(c,i){return '<tr><td>Week '+(i+1)+(i===0?' <span class="muted small">(+ rice, oats, peanut butter, oil, tuna)</span>':i===2?' <span class="muted small">(+ rice, oats, seasoning)</span>':"")+'</td><td class="r">EC$'+c+'</td></tr>'}).join("")+'<tr class="tot"><td>Month</td><td class="r">EC$'+weeks.reduce(function(a,b){return a+b},0)+'</td></tr></table>'+
'<p class="small muted" style="margin:10px 0 0">The 4 weekly lists add up exactly to the month list. Shop by the month list if you get paid monthly, or week by week. Same food either way.</p></div></div>';
o+='<div class="grid g2e" style="margin-top:16px"><div class="card"><h2>More protein for the same EC$350</h2><ul class="clean small" style="margin-top:8px"><li><b>Cheaper chicken:</b> if leg quarters or whole chicken are EC$6/lb or less, the same EC$90 buys 15 lb, which brings you to about 105 g a day.</li><li><b>Swap carbs for lentils:</b> 3 loaves instead of 4 and 1 kg oats instead of 1.5 kg frees EC$13 for 1 kg more lentils (+8 g a day).</li><li><b>Skip the tuna</b> (EC$10) and put it toward 1 more lb of chicken.</li><li>All three together get you to about 110 g. Set the goal to 110 g in Food.</li></ul></div>'+
'<div class="card"><h2>Cheapest protein per EC$</h2><p class="sub">From the price estimates</p><table style="margin-top:8px"><tr><th>Food</th><th class="r">EC$ per 25 g protein</th></tr><tr><td>Dried beans / lentils</td><td class="r">~1.30</td></tr><tr><td>Chicken (thighs, drumsticks, whole)</td><td class="r">~2.30</td></tr><tr><td>Chicken breast</td><td class="r">~2.60</td></tr><tr><td>Peanut butter</td><td class="r">~3.00</td></tr><tr><td>Tuna</td><td class="r">~5.00</td></tr><tr><td>Milk</td><td class="r">~6.00</td></tr></table></div></div>';return o}

var M=[["d1","Day 1"],["d15","Day 15"],["d30","Day 30"]],F=[["weight","Weight (lb)"],["waist","Waist (in)"],["chest","Chest (in)"],["arm","Arm (in)"],["bench","Bench (lb × reps)"],["row","Row (lb × reps)"]];
return '<div class="grid g2"><div class="card"><div class="hd"><div><h2>30-day calendar</h2><p class="sub">Dot = workout done · bar = habits</p></div></div><div class="cal">'+cells+'</div></div>'+
'<div class="card"><h2>Start date</h2><p class="sub">Pick a Monday. The app then opens on the right day.</p><input type="date" id="start" value="'+esc(S.start)+'" style="margin:12px 0 18px"><h2>Protein log</h2><p class="sub">Days that hit 130 g+</p><div class="tiles"><div class="tile"><small>On target</small><b>'+(function(){var n=0;for(var d=1;d<=30;d++)if(prot(d)>=130)n++;return n})()+'</b><span>days</span></div><div class="tile"><small>Average logged</small><b>'+(function(){var n=0,s=0;for(var d=1;d<=30;d++){var v=prot(d);if(v){n++;s+=v}}return n?Math.round(s/n):0})()+' g</b><span>on days logged</span></div></div><button class="btn sm danger" id="reset">Reset all tracking</button></div></div>'+
'<div class="card" style="margin-top:16px"><div class="hd"><div><h2>Measurements</h2><p class="sub">Morning, before eating · waist at the navel · add front & side photos on the same days</p></div></div><div style="overflow-x:auto"><table><tr><th></th>'+M.map(function(m){return '<th>'+m[1]+'</th>'}).join("")+'</tr>'+F.map(function(f){return '<tr><td><b>'+f[1]+'</b></td>'+M.map(function(m){return '<td><input type="text" data-m="'+m[0]+'" data-f="'+f[0]+'" value="'+esc((S.meas[m[0]]||{})[f[0]])+'"></td>'}).join("")+'</tr>'}).join("")+'</table></div></div>'}

function sheet(){var list=S.prot[sel]||[];var m=document.createElement("div");m.className="sheet";m.id="sheet";
m.innerHTML='<div class="card"><div class="hd"><div><h2>Log protein · Day '+sel+'</h2><p class="sub">'+prot(sel)+' of '+PT+' g so far</p></div><button class="iconbtn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+bar(prot(sel)/PT)+'<div class="qa" style="margin-top:14px">'+PQ.map(function(q,i){return '<button data-qa="'+i+'"><b>+'+q[1]+' g</b><span>'+q[0]+'</span></button>'}).join("")+'</div>'+
(list.length?'<h2 style="margin:18px 0 6px;font-size:14px">Logged today</h2><div class="list">'+list.map(function(x,i){return '<div class="ck" style="display:flex"><span>'+esc(x[0])+'</span><em>'+x[1]+' g <button class="btn sm" data-undo="'+i+'" style="margin-left:8px">Remove</button></em></div>'}).join("")+'</div>':"")+'</div>';
document.body.appendChild(m)}
function closeSheet(){var s=document.getElementById("sheet");if(s)s.remove()}

function render(){var b=tab==="workout"?workout():tab==="food"?food():tab==="shop"?shopV():tab==="progress"?progress():home();
document.getElementById("app").innerHTML='<div class="wrap">'+top()+b+'</div>'+tabbar()}
function go(d){sel=Math.max(1,Math.min(30,d));try{localStorage.setItem("fit30sel",sel)}catch(e){}mweek=Math.max(0,Math.min(3,mw(sel)));if(gweek!=="m")gweek=mweek;render()}
function setTab(t){tab=t;if(location.hash!=="#"+t)location.hash=t;render();scrollTo(0,0)}
function keep(fn){var y=scrollY;fn();scrollTo(0,y)}

document.addEventListener("click",function(e){var t=e.target.closest("button,[data-close]");if(!t)return;var ds=t.dataset;
if(t.classList.contains("sheet")||ds.close!==undefined){closeSheet();return}
if(ds.tab){setTab(ds.tab);return}
if(ds.step){keep(function(){go(sel+(+ds.step))});return}
if(ds.go){go(+ds.go);setTab("workout");return}
if(ds.mw){keep(function(){mweek=+ds.mw;render()});return}
if(ds.gw){keep(function(){gweek=ds.gw==="m"?"m":+ds.gw;render()});return}
if(ds.goal){PT=+ds.goal;S.goal=PT;save();keep(render);return}
if(ds.qa){var q=PQ[+ds.qa];(S.prot[sel]=S.prot[sel]||[]).push([q[0],q[1]]);if(prot(sel)>=PT){var h=S.habits[sel]||[];h[1]=true;S.habits[sel]=h}save();var open=!!document.getElementById("sheet");keep(render);if(open){closeSheet();sheet()};return}
if(ds.undo){S.prot[sel].splice(+ds.undo,1);save();keep(render);closeSheet();sheet();return}
if(t.id==="fab"||t.id==="fab2"||t.id==="fab3"){sheet();return}
if(t.id==="theme"){theme=theme==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",theme);try{localStorage.setItem("fit30theme",theme)}catch(x){}keep(render);return}
if(t.id==="reset"){var m=document.createElement("div");m.className="sheet";m.id="sheet";m.innerHTML='<div class="card"><h2>Reset all tracking?</h2><p class="sub" style="margin:8px 0 16px">Clears every tick, log, protein entry, note and measurement. This can’t be undone.</p><div style="display:flex;gap:8px"><button class="btn danger" id="yes">Reset everything</button><button class="btn" data-close>Cancel</button></div></div>';document.body.appendChild(m);return}
if(t.id==="yes"){S={habits:{},logs:{},shop:{},meas:{},notes:{},prot:{},start:S.start};closeSheet();save();render();return}});
document.addEventListener("click",function(e){if(e.target.classList&&e.target.classList.contains("sheet"))closeSheet()});
document.addEventListener("change",function(e){var t=e.target,d=sel,ds=t.dataset;
if(t.id==="daysel"){go(+t.value);return}
if(ds.hab!=null){var h=S.habits[d]||[];h[+ds.hab]=t.checked;S.habits[d]=h}
else if(ds.ex!=null){var lg=S.logs[d]=S.logs[d]||{},o=lg[ds.ex]=lg[ds.ex]||{};o.x=t.checked;var w=W[wd(d)];if(exDone(d)===w.ex.length){var hh=S.habits[d]||[];hh[0]=true;S.habits[d]=hh}}
else if(ds.log!=null){var lg2=S.logs[d]=S.logs[d]||{},o2=lg2[ds.log]=lg2[ds.log]||{};o2[ds.f]=t.value;if(t.value){var hb=S.habits[d]||[];hb[5]=true;S.habits[d]=hb}save();return}
else if(ds.shop!=null){var sh=S.shop[gweek]=S.shop[gweek]||{};sh[ds.shop]=t.checked}
else if(ds.m){var mm=S.meas[ds.m]=S.meas[ds.m]||{};mm[ds.f]=t.value;save();return}
else if(t.id==="note"){S.notes[d]=t.value;save();return}
else if(t.id==="start"){S.start=t.value;if(S.start){var x=dayFromDate();if(x>=1&&x<=30)sel=x}}
else return;
save();keep(render)});
document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"){var a=t.closest(".art");if(a)a.classList.add("bad")}},true);
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(h!==tab&&TABS.some(function(t){return t[0]===h})){tab=h;render()}});
render();
})();
</script>
</body>
</html>
